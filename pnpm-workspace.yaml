packages:
  - 'apps/*'
  - 'packages/*'
  - 'brand'

# Install scripts allowed (pnpm 11 blocks them by default): bundler and renderer binaries.
allowBuilds:
  esbuild: true
  sharp: true
  '@remotion/compositor-darwin-arm64': true

minimumReleaseAgeExclude:
  - '@remotion/bundler@4.0.536'
  - '@remotion/captions@4.0.536'
  - '@remotion/cli@4.0.536'
  - '@remotion/codemods@4.0.536'
  - '@remotion/compositor-darwin-arm64@4.0.536'
  - '@remotion/compositor-darwin-x64@4.0.536'
  - '@remotion/compositor-linux-arm64-gnu@4.0.536'
  - '@remotion/compositor-linux-arm64-musl@4.0.536'
  - '@remotion/compositor-linux-x64-gnu@4.0.536'
  - '@remotion/compositor-linux-x64-musl@4.0.536'
  - '@remotion/compositor-win32-x64-msvc@4.0.536'
  - '@remotion/elevenlabs@4.0.536'
  - '@remotion/licensing@4.0.536'
  - '@remotion/media-utils@4.0.536'
  - '@remotion/media@4.0.536'
  - '@remotion/openai-whisper@4.0.536'
  - '@remotion/paths@4.0.536'
  - '@remotion/player@4.0.536'
  - '@remotion/renderer@4.0.536'
  - '@remotion/sdk@4.0.536'
  - '@remotion/streaming@4.0.536'
  - '@remotion/studio-protocol@4.0.536'
  - '@remotion/studio-server@4.0.536'
  - '@remotion/studio-shared@4.0.536'
  - '@remotion/studio@4.0.536'
  - '@remotion/timeline-utils@4.0.536'
  - '@remotion/web-renderer@4.0.536'
  - '@remotion/zod-types@4.0.536'
  - eslint@10.13.0
  - happy-dom@21.0.3
  - remotion@4.0.536
  - satori@0.62.0
