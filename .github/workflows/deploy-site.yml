name: 🚀 Deploy website
run-name: "🚀 Website ${{ inputs.ref || 'main' }} by @${{ github.actor }}"

# The release button for ferrocast.clearcraftlabs.com: Actions → "🚀 Deploy website" →
# Run workflow. Leave the ref blank to ship the tip of main, or enter an older commit or
# tag to roll back. Nothing deploys on push; the site only changes when this is run.
#
# Builds apps/site, runs the site's browser tests, uploads apps/site/dist to the
# Cloudflare Pages project `ferrocast-site`, then checks the public address.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with Account › Cloudflare Pages › Edit
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that owns ferrocast-site

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch (blank = main)'
        required: false
        type: string

# One deploy at a time; a second click waits instead of racing.
concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: ferrocast-site
  SITE_URL: https://ferrocast.clearcraftlabs.com

jobs:
  deploy:
    name: Deploy ${{ inputs.ref || 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: website
      url: https://ferrocast.clearcraftlabs.com
    steps:
      - name: Check secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm --filter @ferrocast/site build

      # The site's own browser tests (Chromium). The star-field tests skip here: CI has no
      # real GPU, and the no-GPU test covers that path.
      - name: Browser tests
        run: |
          pnpm --filter @ferrocast/site exec playwright install --with-deps chromium
          pnpm --filter @ferrocast/site exec playwright test --project=chromium

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.151.1 pages deploy apps/site/dist \
            --project-name "$PROJECT" --branch main \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "$(git log -1 --format=%s)" 2>&1 | tee deploy.log

      - name: Check the public site
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$SITE_URL/" -o /dev/null; then echo "Public site OK"; exit 0; fi
            sleep 10
          done
          echo "::warning::Uploaded, but $SITE_URL isn't answering yet. Check the Pages custom domain."

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "### ✅ Website \`$(git rev-parse --short HEAD 2>/dev/null)\` is live at $SITE_URL"
            else
              echo "### ❌ The website was not deployed"
            fi
            echo "Requested by @$GITHUB_ACTOR (ref: ${{ inputs.ref || 'main' }})."
            if [ -f deploy.log ]; then echo; echo '```'; tail -n 15 deploy.log; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
