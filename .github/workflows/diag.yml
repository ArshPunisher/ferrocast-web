name: Diag

# Temporary: Linux WebKit frame-rate probes (removed before the PR is ready).
on:
  pull_request:
    paths:
      [
        '.github/workflows/diag.yml',
        'apps/dashboard/diag/**',
        'apps/dashboard/playwright.diag.config.ts',
      ]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ferrocast/dashboard exec playwright install --with-deps webkit
      - run: pnpm build
      - run: pnpm --filter @ferrocast/dashboard exec playwright test -c playwright.diag.config.ts
        env:
          CI: '1'
