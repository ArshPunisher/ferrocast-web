name: CI

# Every gate from tools/check.sh on each push to main and each PR.
# Actions are pinned to commit SHAs (same pins as the owner's other projects).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, types, lint, unit tests, builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit tests (API client, demo engine, overlay logic)
        run: pnpm -r --if-present test
      - name: Shellcheck
        run: shellcheck tools/*.sh
      - name: Build (dist/dashboard, dist/overlays, site)
        run: pnpm build
      - name: The desktop app embeds these
        run: test -f dist/dashboard/index.html && test -f dist/overlays/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: |
            dist/
            apps/site/dist/
          retention-days: 7

  e2e:
    name: Browser tests (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [overlays, dashboard, site]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browsers
        run: pnpm --filter @ferrocast/${{ matrix.app }} exec playwright install --with-deps chromium webkit
      - name: Build what the tests serve
        run: pnpm build
      - name: Playwright
        run: pnpm --filter @ferrocast/${{ matrix.app }} e2e
        env:
          CI: '1'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results/
          retention-days: 7

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conventional subjects, no AI attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" > msg.txt
            tools/check-commit-msg.sh msg.txt || status=1
          done
          exit $status
